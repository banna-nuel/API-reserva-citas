name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Solo lectura del repositorio: el workflow no publica nada ni usa secretos
permissions:
  contents: read

# Una corrida nueva de la misma rama o PR cancela la anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest        # incluye Docker, necesario para Testcontainers
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Pruebas unitarias, de integración (MySQL en Testcontainers) y chequeo de cobertura de JaCoCo
      - name: Verify
        run: ./mvnw -B verify
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn
